<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Cadastro de Clientes</title>
</h:head>

<h:body>
    <h1>Cadastro de Clientes</h1>
    <p:button value="Voltar ao Menu" outcome="index.xhtml" icon="pi pi-home" style="margin-bottom: 15px;" />

    <h:form>
        <p:messages showDetail="true" showSummary="false" closable="true" />

        <p:panel header="Dados do Cliente">
            <p:panelGrid columns="2" layout="grid">

                <p:outputLabel value="Nome:" />
                <p:inputText value="#{clienteBean.cliente.nomeCliente}" />

                <p:outputLabel value="Endereço:" />
                <p:inputText value="#{clienteBean.cliente.endereco}" />

                <p:outputLabel value="UF:" />
                <p:inputText value="#{clienteBean.cliente.uf}" maxlength="2" />

                <p:outputLabel value="Telefone:" />
                <p:inputText value="#{clienteBean.cliente.telefone}" />

                <p:outputLabel value="CPF:" />
                <p:inputText value="#{clienteBean.cliente.cpf}" />

                <p:outputLabel value="E-mail:" />
                <p:inputText value="#{clienteBean.cliente.email}" />

            </p:panelGrid>

            <p:commandButton value="Salvar" action="#{clienteBean.salvar()}" icon="pi pi-save" style="margin-top: 10px;" ajax="false" />
        </p:panel>

        <p:panel header="Clientes Cadastrados" style="margin-top: 20px;">
            <p:dataTable value="#{clienteBean.listaClientes}" var="c">

                <p:column headerText="Nome">
                    #{c.nomeCliente}
                </p:column>

                <p:column headerText="CPF">
                    #{c.cpf}
                </p:column>

                <p:column headerText="Telefone">
                    #{c.telefone}
                </p:column>

                <p:column headerText="E-mail">
                    #{c.email}
                </p:column>

                <p:column headerText="Ação">
                    <p:commandButton value="Editar" action="#{clienteBean.editar(c)}" icon="pi pi-pencil" style="margin-right: 5px;" ajax="false" />
                    <p:commandButton value="Excluir" action="#{clienteBean.excluir(c)}" icon="pi pi-trash" ajax="false" />
                </p:column>

            </p:dataTable>
        </p:panel>
    </h:form>

</h:body>
</html>
