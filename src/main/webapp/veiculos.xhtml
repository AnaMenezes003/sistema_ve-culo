<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Cadastro de Veículos</title>
</h:head>

<h:body>
    <h1>Cadastro de Veículos</h1>
    <p:button value="Voltar ao Menu" outcome="index.xhtml" icon="pi pi-home" style="margin-bottom: 15px;" />

    <h:form>
        <p:messages showDetail="true" showSummary="false" closable="true" />

        <p:panel header="Dados do Veículo">
            <p:panelGrid columns="2" layout="grid">

                <p:outputLabel value="Número:" />
                <p:inputText value="#{veiculoBean.veiculo.numero}" />

                <p:outputLabel value="Placa:" />
                <p:inputText value="#{veiculoBean.veiculo.placa}" />

                <p:outputLabel value="Fabricante:" />
                <p:inputText value="#{veiculoBean.veiculo.fabricante}" />

                <p:outputLabel value="Modelo:" />
                <p:inputText value="#{veiculoBean.veiculo.modelo}" />

                <p:outputLabel value="Ano do Modelo:" />
                <p:inputText value="#{veiculoBean.veiculo.anoModelo}" />

                <p:outputLabel value="Quantidade de Portas:" />
                <p:inputText value="#{veiculoBean.veiculo.qtdPortas}" />

                <p:outputLabel value="Acessórios:" />
                <p:inputText value="#{veiculoBean.veiculo.acessorios}" />

            </p:panelGrid>

            <p:commandButton value="Salvar" action="#{veiculoBean.salvar()}" icon="pi pi-save" style="margin-top: 10px;" ajax="false" />
        </p:panel>

        <p:panel header="Veículos Cadastrados" style="margin-top: 20px;">
            <p:dataTable value="#{veiculoBean.listaVeiculos}" var="v">

                <p:column headerText="Número">
                    #{v.numero}
                </p:column>

                <p:column headerText="Placa">
                    #{v.placa}
                </p:column>

                <p:column headerText="Fabricante">
                    #{v.fabricante}
                </p:column>

                <p:column headerText="Modelo">
                    #{v.modelo}
                </p:column>

                <p:column headerText="Ano">
                    #{v.anoModelo}
                </p:column>

                <p:column headerText="Ação">
                    <p:commandButton value="Editar" action="#{veiculoBean.editar(v)}" icon="pi pi-pencil" style="margin-right: 5px;" ajax="false" />
                    <p:commandButton value="Excluir" action="#{veiculoBean.excluir(v)}" icon="pi pi-trash" ajax="false" />
                </p:column>

            </p:dataTable>
        </p:panel>
    </h:form>

</h:body>
</html>
