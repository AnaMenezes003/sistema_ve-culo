<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Cadastro de Aluguéis</title>
</h:head>

<h:body>
    <h1>Cadastro de Aluguéis</h1>
    <p:button value="Voltar ao Menu" outcome="index.xhtml" icon="pi pi-home" style="margin-bottom: 15px;" />

    <h:form>
        <p:messages showDetail="true" showSummary="false" closable="true" />

        <p:panel header="Dados do Aluguel">
            <p:panelGrid columns="2" layout="grid">

                <p:outputLabel value="Veículo:" />
                <p:selectOneMenu value="#{aluguelBean.veiculoId}">
                    <f:selectItem itemLabel="Selecione..." itemValue="#{null}" />
                    <f:selectItems value="#{aluguelBean.listaVeiculos}" var="v"
                                    itemLabel="#{v.placa} - #{v.modelo}" itemValue="#{v.id}" />
                </p:selectOneMenu>

                <p:outputLabel value="Cliente:" />
                <p:selectOneMenu value="#{aluguelBean.clienteId}">
                    <f:selectItem itemLabel="Selecione..." itemValue="#{null}" />
                    <f:selectItems value="#{aluguelBean.listaClientes}" var="c"
                                    itemLabel="#{c.nomeCliente} - #{c.cpf}" itemValue="#{c.id}" />
                </p:selectOneMenu>

                <p:outputLabel value="Data do Aluguel:" />
                <p:calendar value="#{aluguelBean.aluguel.dataAluguel}" pattern="dd/MM/yyyy" />

                <p:outputLabel value="Data de Entrega Prevista:" />
                <p:calendar value="#{aluguelBean.aluguel.dataEntrega}" pattern="dd/MM/yyyy" />

                <p:outputLabel value="Observação:" />
                <p:inputText value="#{aluguelBean.aluguel.observacao}" />

                <p:outputLabel value="Valor Pago:" />
                <p:inputNumber value="#{aluguelBean.aluguel.valorPago}" symbol="R$ " />

            </p:panelGrid>

            <p:commandButton value="Salvar" action="#{aluguelBean.salvar()}" icon="pi pi-save" style="margin-top: 10px;" ajax="false" />
        </p:panel>

        <p:panel header="Aluguéis Cadastrados" style="margin-top: 20px;">
            <p:dataTable value="#{aluguelBean.listaAlugueis}" var="a">

                <p:column headerText="Veículo">
                    #{a.veiculo.placa}
                </p:column>

                <p:column headerText="Cliente">
                    #{a.cliente.nomeCliente}
                </p:column>

                <p:column headerText="Data Aluguel">
                    <h:outputText value="#{a.dataAluguel}">
                        <f:convertDateTime pattern="dd/MM/yyyy" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Entregue">
                    #{a.entregue}
                </p:column>

                <p:column headerText="Ação">
                    <p:commandButton value="Editar" action="#{aluguelBean.editar(a)}" icon="pi pi-pencil" style="margin-right: 5px;" ajax="false" />
                    <p:commandButton value="Excluir" action="#{aluguelBean.excluir(a)}" icon="pi pi-trash" ajax="false" />
                </p:column>

            </p:dataTable>
        </p:panel>
    </h:form>

</h:body>
</html>
